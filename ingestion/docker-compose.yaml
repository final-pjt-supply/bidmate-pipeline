# Airflow 단일 노드 (LocalExecutor) — 메타DB는 같은 박스 Postgres 컨테이너, 수집+다운로드 DAG 전용.
# Redis/Celery worker/Flower 없음 (LocalExecutor). 외부 RDS 없음 (postgres 컨테이너 내장).
#
# 사전 준비: .env 작성 (.env.example 참고), IAM 역할로 S3 접근.
# 기동: docker compose up -d --build
# UI: http://<EC2-IP>:8080

x-airflow-common: &airflow-common
  build: .
  image: bidding-airflow:2.10.5
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # 선형 DAG(4태스크)라 병렬도는 작게
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    # ── 수집·다운로드 스크립트가 읽는 환경변수 (DAG가 subprocess로 실행) ──
    BIDDING_AGENT_HOME: /opt/bidding-agent
    BIDDING_AGENT_PYTHON: python
    G2B_SERVICE_KEY: ${G2B_SERVICE_KEY}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    # ── 서비스 RDS (bid_stats_refresh DAG 전용) ──
    # 위 POSTGRES_*는 Airflow 메타DB(postgres 컨테이너)라 재사용할 수 없다.
    # 이름을 겹치면 DAG이 조용히 메타DB에 붙는다.
    STATS_DB_HOST: ${STATS_DB_HOST}
    STATS_DB_PORT: ${STATS_DB_PORT:-5432}
    STATS_DB_NAME: ${STATS_DB_NAME}
    STATS_DB_USER: ${STATS_DB_USER}
    STATS_DB_PASSWORD: ${STATS_DB_PASSWORD}
    STATS_DB_SSLMODE: ${STATS_DB_SSLMODE:-require}
    # AWS 자격증명은 EC2 IAM 역할(instance profile)로 자동 주입 — 키를 넣지 말 것.
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # repo 전체를 마운트 — DAG가 여기서 python raw_json_daily.py 등을 실행한다.
    - .:/opt/bidding-agent
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-airflow}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-airflow}" \
          --firstname admin --lastname admin --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-db-volume:
