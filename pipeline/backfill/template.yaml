AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LLM 자격요건 추출 backfill (S3 Batch → Lambda).
  extracted/downloads/backfill/ → qualifications/backfill/.
  realtime과 완전 분리된 자체 이미지·스택. SAM이 Dockerfile로 이미지를 직접 빌드.

Parameters:
  SourceBucketName:
    Type: String
    Default: bidmate

  BedrockApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Bedrock API 키(bearer). Default에 넣지 말고 배포 시
      `sam deploy --parameter-overrides BedrockApiKey=<실제키>`로 전달.
      botocore가 AWS_BEARER_TOKEN_BEDROCK env로 자동 인증.

  BedrockRegion:
    Type: String
    Default: "us-east-1"

  BedrockModelId:
    Type: String
    Default: "qwen.qwen3-next-80b-a3b"

Resources:
  BackfillLlmFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: backfill-llm-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: backfill-llm-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExtracted
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: HeadWriteQualifications
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/qualifications/*"
              # 멱등 HeadObject: ListBucket이 없으면 없는 객체에 404 대신 403이 떠서
              # object_exists가 Permanent로 오분류됨. backfill prefix로 스코프해 부여.
              - Sid: ListBucketForHeadCheck
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "extracted/downloads/backfill/*"
                      - "qualifications/backfill/*"

  BackfillLlmFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: pipeline/backfill/Dockerfile
      DockerContext: ../..
    Properties:
      FunctionName: backfill-extract-llm
      PackageType: Image
      Role: !GetAtt BackfillLlmFunctionRole.Arn
      Timeout: 600  # 긴 TTFT(서버측 지연)로 일부 건이 180초 초과 → 600으로 상향(Lambda 최대 900)
      MemorySize: 1024
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          AWS_BEDROCK_REGION: !Ref BedrockRegion
          AWS_BEARER_TOKEN_BEDROCK: !Ref BedrockApiKey

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: backfill-llm-batch-job-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: batchoperations.s3.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: batch-invoke-and-s3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]  # 버전관리 버킷: S3 Batch가 매니페스트를 버전 고정해 읽음
                Resource: !Sub arn:aws:s3:::${SourceBucketName}/manifests/*
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub arn:aws:s3:::${SourceBucketName}/batch-reports/*
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                # S3 Batch가 :$LATEST 한정자로 호출하므로 unqualified + qualified(:*) 둘 다 허용
                Resource:
                  - !GetAtt BackfillLlmFunction.Arn
                  - !Sub "${BackfillLlmFunction.Arn}:*"

Outputs:
  BackfillLlmFunctionArn:
    Value: !GetAtt BackfillLlmFunction.Arn
  BatchJobRoleArn:
    Value: !GetAtt BatchJobRole.Arn
