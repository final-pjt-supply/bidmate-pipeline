AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  실시간 입찰공고 문서 처리 파이프라인.
  S3 업로드 → 이벤트 알림 → SQS(pdf/hwp/hwpx 3개) → Lambda 텍스트 추출.
  S3 이벤트 알림(원본 버킷 → 큐 라우팅)은 이 template 밖에서 배포 후 별도 설정한다
  (bidmate 버킷이 SAM 스택 밖에서 이미 만들어져 있고, 다른 팀원 소유의 읽기전용
  원본 버킷임 — 실키 구조는 raw/downloads/daily/biz_div={업종}/year=/month=/day=/hour=/...).

Globals:
  Function:
    Timeout: 120       # 큰 PDF 대비 여유 있게
    MemorySize: 1024

Parameters:
  ImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-extractor:latest
    Description: >
      이미 ECR에 push된 추출기 이미지. SAM이 새로 빌드하지 않고 이 이미지를 그대로 참조한다
      (pdf/hwp/hwpx 3개 함수가 이미지 하나를 공유하고 ImageConfig.Command만 다르게 오버라이드).

  SourceBucketName:
    Type: String
    Default: bidmate
    Description: >
      raw/extracted/qualifications가 있는 S3 버킷 이름. SAM 밖에서 이미 생성된
      버킷(다른 팀원 소유, 원본은 읽기전용)이라 이름만 참조. 같은 AWS 계정(890608337282)
      소속으로 확인함 — 다른 계정이면 아래 IAM 정책이 그대로 안 먹을 수 있음.

  NvidiaApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      NVIDIA Build API 키. 실제 값은 여기 Default에 넣지 말고 배포 시
      `sam deploy --parameter-overrides NvidiaApiKey=<실제키>`처럼 CLI로 직접 넘길 것
      (samconfig.toml은 git에 커밋되므로 여기에 실제 키를 적으면 히스토리에 평문으로 남는다).

  LlmBaseUrl:
    Type: String
    Default: "https://integrate.api.nvidia.com/v1"
    Description: LLM API base_url. 다른 OpenAI 호환 API로 교체할 경우만 바꾸면 됨.

  LlmModel:
    Type: String
    Default: "qwen/qwen3-next-80b-a3b-instruct"
    Description: >
      LLM 모델 이름. 3모델(현행 llama-3.1-8b/kimi-k2.6/qwen3-next-80b) x 4유형(물품/용역/공사/외자)
      x 3회 라이브 테스트 결과 qwen3-next-80b-a3b-instruct 채택 — few-shot 오염 0/12,
      joint_venture_allowed 정답률 12/12, recall이 나머지 둘보다 뚜렷하게 우수.

Resources:
  # ============================================================
  # SQS — 메인 큐 3개 + DLQ 3개 (maxReceiveCount 3회 초과 시 DLQ로 이동)
  # ============================================================
  ExtractPdfDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-pdf-queue-dlq

  ExtractPdfQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-pdf-queue
      VisibilityTimeout: 720   # Lambda Timeout(120s)의 6배 — AWS 권장값
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractPdfDlq.Arn
        maxReceiveCount: 3

  ExtractHwpDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwp-queue-dlq

  ExtractHwpQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwp-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractHwpDlq.Arn
        maxReceiveCount: 3

  ExtractHwpxDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwpx-queue-dlq

  ExtractHwpxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwpx-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractHwpxDlq.Arn
        maxReceiveCount: 3

  LlmExtractDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: llm-extract-queue-dlq

  LlmExtractQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: llm-extract-queue
      # Lambda Timeout(180s)의 2배(=360s). 다른 큐들의 6배 관례보다 짧게 잡은 이유:
      # VisibilityTimeout이 Lambda Timeout보다만 충분히 크면(정상 처리 시간은 실측 약 27초라
      # 여유는 충분) 목적 달성 — 여기서 "충분히 크게"는 함수가 아직 정상 처리 중인데
      # 가시성 타임아웃이 만료돼 다른 워커가 같은 메시지를 집어가는(중복 처리) 사태를
      # 막을 정도면 되고, 6배(1080s)까지 늘릴 필요는 없다(실패 시 재시도가 그만큼 늦어질 뿐).
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LlmExtractDlq.Arn
        maxReceiveCount: 3

  # ============================================================
  # IAM — 함수별 실행 역할.
  # 셋 다 동일한 패턴(S3 읽기 raw/downloads/daily/*, S3 쓰기 extracted/*, 자기 큐 수신, 다음 큐 송신)이지만
  # "자기 큐" 수신 권한이 함수마다 다른 큐로 스코프돼야 해서 역할을 3개로 분리했다.
  # ============================================================
  ExtractPdfFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: extract-pdf-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs 기본 쓰기 권한 (Lambda 실행 로그)
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: extract-pdf-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                # raw/* 전체가 아니라 raw/downloads/daily/*로 스코프 제한 — bidmate엔
                # raw/raw/, raw/curated/(공고 메타데이터, 첨부파일 아님), raw/downloads/backfill/
                # (별도 파이프라인 backfill_lambda 소관)도 있어서 최소권한으로 좁힘.
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtractedText
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
        - PolicyName: extract-pdf-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExtractPdfQueue.Arn
              - Sid: SendToNextQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LlmExtractQueue.Arn

  ExtractHwpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: extract-hwp-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: extract-hwp-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                # raw/* 전체가 아니라 raw/downloads/daily/*로 스코프 제한 — bidmate엔
                # raw/raw/, raw/curated/(공고 메타데이터, 첨부파일 아님), raw/downloads/backfill/
                # (별도 파이프라인 backfill_lambda 소관)도 있어서 최소권한으로 좁힘.
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtractedText
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
        - PolicyName: extract-hwp-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExtractHwpQueue.Arn
              - Sid: SendToNextQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LlmExtractQueue.Arn

  ExtractHwpxFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: extract-hwpx-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: extract-hwpx-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                # raw/* 전체가 아니라 raw/downloads/daily/*로 스코프 제한 — bidmate엔
                # raw/raw/, raw/curated/(공고 메타데이터, 첨부파일 아님), raw/downloads/backfill/
                # (별도 파이프라인 backfill_lambda 소관)도 있어서 최소권한으로 좁힘.
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtractedText
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
        - PolicyName: extract-hwpx-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExtractHwpxQueue.Arn
              - Sid: SendToNextQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LlmExtractQueue.Arn

  # LLM 추출 역할은 파이프라인 마지막 단계라 다음 큐로 보낼 SendMessage 권한이 없다
  # (S3 읽기 대상도 raw/*가 아니라 extracted/*, 쓰기 대상은 qualifications/*로 다름).
  # ⚠ "extracted"/"qualifications" 리터럴은 common/paths.py의 EXTRACTED_PREFIX/
  # QUALIFICATIONS_PREFIX 상수와 반드시 같아야 한다(2026-07-08 팀 명명 확정 —
  # extracted는 backfill_lambda 선례와 통일, qualifications는 구 llm_extracted).
  LlmExtractFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: llm-extract-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: llm-extract-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExtractedText
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: WriteLlmExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/qualifications/*"
        - PolicyName: llm-extract-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt LlmExtractQueue.Arn

  # ============================================================
  # Lambda — 3개 함수, 이미지 1개 공유(ImageUri 동일) + ImageConfig.Command만 다르게.
  # 각각 대응하는 큐를 SQS 트리거로 연결. BatchSize=1: handler가 배치 내 실패를 개별
  # 처리하지 않고 예외 하나로 전체를 재시도시키므로(코드 참고: src/handlers/*), 한 번에
  # 메시지 1개씩만 받아야 실패한 메시지만 정확히 재시도/DLQ된다.
  # ============================================================
  ExtractPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-pdf-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_pdf.lambda_handler"]
      Role: !GetAtt ExtractPdfFunctionRole.Arn
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref LlmExtractQueue
      Events:
        PdfQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractPdfQueue.Arn
            BatchSize: 1

  ExtractHwpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwp-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_hwp.lambda_handler"]
      Role: !GetAtt ExtractHwpFunctionRole.Arn
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref LlmExtractQueue
      Events:
        HwpQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractHwpQueue.Arn
            BatchSize: 1

  ExtractHwpxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwpx-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_hwpx.lambda_handler"]
      Role: !GetAtt ExtractHwpxFunctionRole.Arn
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref LlmExtractQueue
      Events:
        HwpxQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractHwpxQueue.Arn
            BatchSize: 1

  # LLM 추출 함수 — 같은 이미지 공유, CMD만 다름. NVIDIA Build API의 분당 요청 한도(40 RPM) 대비
  # ReservedConcurrentExecutions로 동시 실행 수를 제한(안 걸면 SQS 트리거가 메시지 쌓인 만큼
  # 동시에 확장해서 순식간에 RPM을 초과시킬 수 있음). qwen3-next-80b 채택 후 실측 처리시간
  # 약 27초/건 기준, 동시성 5 = 약 11 RPM(60s/27s * 5)으로 한도(40 RPM) 대비 충분히 안전.
  # Timeout도 180초로 올림 — 큰 문서·모델 응답 지연 대비 여유(기존 Globals 120초로는
  # 27초 실측 대비 안전하지만, 느린 케이스·모델 큐잉 지연을 감안해 개별 오버라이드).
  LlmExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-llm-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_llm.lambda_handler"]
      Role: !GetAtt LlmExtractFunctionRole.Arn
      Timeout: 180
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          NVIDIA_API_KEY: !Ref NvidiaApiKey
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_MODEL: !Ref LlmModel
      Events:
        LlmQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt LlmExtractQueue.Arn
            BatchSize: 1

  # LlmExtractQueue 적체 감지용 — 액션 없이 콘솔 확인용(알람 상태만 봄, SNS 등 통보 없음).
  # 15분(Period 300s x EvaluationPeriods 3) 이상 지속적으로 메시지 100개 넘게 쌓이면
  # ReservedConcurrentExecutions=5 제한 때문에 처리가 밀리고 있다는 신호.
  LlmExtractQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: llm-extract-queue-backlog
      AlarmDescription: >
        LlmExtractQueue에 메시지가 15분 이상 100개를 초과해 쌓여있음(콘솔 확인용, 액션 없음).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt LlmExtractQueue.QueueName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
