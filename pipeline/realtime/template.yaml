AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  실시간 입찰공고 문서 처리 파이프라인 (2026-07-08 재구축).
  S3(bidmate) 업로드 → 이벤트 알림 → SQS(pdf/hwp/hwpx 3개) → 추출 Lambda 3개
  → extracted/ 저장 + LLM 큐로 직접 메시지 → LLM Lambda → qualifications/ 저장.
  Step Functions는 쓰지 않는다 — 전부 SQS 메시지 체이닝으로 연결.
  S3 이벤트 알림 자체는 이 template 밖에서 별도 스크립트(scripts/setup-s3-events.ps1)로
  설정한다(이 배포엔 포함 안 함).

Parameters:
  ExtractorImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-extractor:latest
    Description: pdf/hwp/hwpx 추출 Lambda 3개가 공유하는 이미지(ECR). CMD만 함수별로 다르게 오버라이드.

  LlmImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-llm:latest
    Description: LLM 자격요건 추출 Lambda 전용 이미지(ECR). CMD가 이미지에 이미 내장돼 있어 오버라이드 안 함.

  SourceBucketName:
    Type: String
    Default: bidmate
    Description: raw/extracted/qualifications가 있는 S3 버킷. 다른 팀원 소유, 원본(raw)은 읽기전용.

  NvidiaApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      NVIDIA Build API 키. 실제 값은 여기 Default에 넣지 말고 배포 시
      `sam deploy --parameter-overrides NvidiaApiKey=<실제키>`처럼 CLI로 직접 넘길 것
      (samconfig.toml은 git에 커밋되므로 여기에 실제 키를 적으면 히스토리에 평문으로 남는다).

  LlmBaseUrl:
    Type: String
    Default: "https://integrate.api.nvidia.com/v1"
    Description: LLM API base_url. 다른 OpenAI 호환 API로 교체할 경우만 바꾸면 됨.

  LlmModel:
    Type: String
    Default: "qwen/qwen3-next-80b-a3b-instruct"
    Description: LLM 모델 이름.

Resources:
  # ============================================================
  # SQS — 4쌍(본큐+DLQ), 전부 Standard 큐.
  # ============================================================
  RealtimeExtractPdfDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-pdf-queue-dlq
      MessageRetentionPeriod: 1209600   # 14일

  RealtimeExtractPdfQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-pdf-queue
      VisibilityTimeout: 720   # Lambda Timeout(120s)의 6배 — AWS 권장값
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeExtractPdfDlq.Arn
        maxReceiveCount: 3

  RealtimeExtractHwpDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwp-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeExtractHwpQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwp-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeExtractHwpDlq.Arn
        maxReceiveCount: 3

  RealtimeExtractHwpxDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwpx-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeExtractHwpxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwpx-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeExtractHwpxDlq.Arn
        maxReceiveCount: 3

  RealtimeLlmExtractDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-llm-extract-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeLlmExtractQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-llm-extract-queue
      # Lambda Timeout(180s)의 2배(=360s). 다른 큐들의 6배 관례보다 짧게 잡은 이유:
      # VisibilityTimeout이 Lambda Timeout보다만 충분히 크면(정상 처리 시간은 실측 약
      # 27초라 여유는 충분) 목적 달성 — 가시성 타임아웃 만료로 다른 워커가 같은
      # 메시지를 집어가는(중복 처리) 사태만 막으면 되고, 6배(1080s)까지 늘릴 필요는 없다.
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeLlmExtractDlq.Arn
        maxReceiveCount: 3

  # ============================================================
  # IAM — 함수별 실행 역할, 최소권한.
  # ============================================================
  RealtimeExtractPdfFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-extract-pdf-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-extract-pdf-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
        - PolicyName: realtime-extract-pdf-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeExtractPdfQueue.Arn
              - Sid: SendToLlmQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn

  RealtimeExtractHwpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-extract-hwp-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-extract-hwp-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
        - PolicyName: realtime-extract-hwp-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeExtractHwpQueue.Arn
              - Sid: SendToLlmQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn

  RealtimeExtractHwpxFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-extract-hwpx-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-extract-hwpx-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
        - PolicyName: realtime-extract-hwpx-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeExtractHwpxQueue.Arn
              - Sid: SendToLlmQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn

  # LLM 역할은 파이프라인 마지막 단계라 다음 큐로 보낼 SendMessage 권한이 없다.
  RealtimeLlmExtractFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-llm-extract-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-llm-extract-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExtracted
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: WriteQualifications
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/qualifications/*"
        - PolicyName: realtime-llm-extract-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn

  # ============================================================
  # Lambda — pdf/hwp/hwpx 3개는 이미지 1개 공유(ExtractorImageUri) + CMD만 다르게.
  # LLM 1개는 별도 이미지(LlmImageUri, CMD 내장). 각각 대응 큐를 SQS 트리거로 연결.
  # BatchSize=1: handler가 배치 내 실패를 개별 처리하지 않고 예외 하나로 전체를
  # 재시도시키므로, 한 번에 메시지 1개씩만 받아야 실패한 메시지만 정확히 재시도/DLQ된다.
  # ============================================================
  RealtimeExtractPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-pdf-dev
      PackageType: Image
      ImageUri: !Ref ExtractorImageUri
      ImageConfig:
        Command: ["handlers.extract_pdf.lambda_handler"]
      Role: !GetAtt RealtimeExtractPdfFunctionRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref RealtimeLlmExtractQueue
      Events:
        PdfQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeExtractPdfQueue.Arn
            BatchSize: 1

  RealtimeExtractHwpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwp-dev
      PackageType: Image
      ImageUri: !Ref ExtractorImageUri
      ImageConfig:
        Command: ["handlers.extract_hwp.lambda_handler"]
      Role: !GetAtt RealtimeExtractHwpFunctionRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref RealtimeLlmExtractQueue
      Events:
        HwpQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeExtractHwpQueue.Arn
            BatchSize: 1

  RealtimeExtractHwpxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwpx-dev
      PackageType: Image
      ImageUri: !Ref ExtractorImageUri
      ImageConfig:
        Command: ["handlers.extract_hwpx.lambda_handler"]
      Role: !GetAtt RealtimeExtractHwpxFunctionRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref RealtimeLlmExtractQueue
      Events:
        HwpxQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeExtractHwpxQueue.Arn
            BatchSize: 1

  # NVIDIA Build API의 분당 요청 한도(40 RPM) 대비 ReservedConcurrentExecutions로 동시
  # 실행 수를 제한(안 걸면 SQS 트리거가 메시지 쌓인 만큼 동시에 확장해서 순식간에 RPM을
  # 초과시킬 수 있음). qwen3-next-80b 기준 실측 처리시간 약 27초/건, 동시성 5 = 약
  # 11 RPM(60s/27s * 5)으로 한도(40 RPM) 대비 충분히 안전.
  RealtimeLlmExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-llm-extract-dev
      PackageType: Image
      ImageUri: !Ref LlmImageUri
      Role: !GetAtt RealtimeLlmExtractFunctionRole.Arn
      Timeout: 180
      MemorySize: 1024
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          NVIDIA_API_KEY: !Ref NvidiaApiKey
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_MODEL: !Ref LlmModel
      Events:
        LlmQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeLlmExtractQueue.Arn
            BatchSize: 1

  # ============================================================
  # CloudWatch 알람 — 전부 콘솔 확인용(AlarmActions 없음, 통보 없음).
  # ============================================================
  RealtimeLlmExtractQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-llm-extract-queue-backlog
      AlarmDescription: >
        realtime-llm-extract-queue에 메시지가 15분 이상 100개를 초과해 쌓여있음
        (콘솔 확인용, 액션 없음). ReservedConcurrentExecutions=5 제한 때문에
        처리가 밀리고 있다는 신호.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeLlmExtractQueue.QueueName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  RealtimeExtractPdfDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-extract-pdf-queue-dlq-has-messages
      AlarmDescription: realtime-extract-pdf-queue-dlq에 메시지가 1개 이상 쌓임(콘솔 확인용, 액션 없음).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeExtractPdfDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  RealtimeExtractHwpDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-extract-hwp-queue-dlq-has-messages
      AlarmDescription: realtime-extract-hwp-queue-dlq에 메시지가 1개 이상 쌓임(콘솔 확인용, 액션 없음).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeExtractHwpDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  RealtimeExtractHwpxDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-extract-hwpx-queue-dlq-has-messages
      AlarmDescription: realtime-extract-hwpx-queue-dlq에 메시지가 1개 이상 쌓임(콘솔 확인용, 액션 없음).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeExtractHwpxDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  RealtimeLlmExtractDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-llm-extract-queue-dlq-has-messages
      AlarmDescription: realtime-llm-extract-queue-dlq에 메시지가 1개 이상 쌓임(콘솔 확인용, 액션 없음).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeLlmExtractDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
