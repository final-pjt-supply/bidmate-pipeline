AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  실시간 입찰공고 문서 처리 파이프라인.
  S3 업로드 → 이벤트 알림 → SQS(pdf/hwp/hwpx 3개) → Lambda 텍스트 추출.
  S3 이벤트 알림(원본 버킷 → 큐 라우팅)은 이 template 밖에서 배포 후 별도 설정한다
  (realtime-dev-ds 버킷이 SAM 스택 밖에서 이미 만들어져 있음).

Globals:
  Function:
    Timeout: 120       # 큰 PDF 대비 여유 있게
    MemorySize: 1024

Parameters:
  ImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-extractor:latest
    Description: >
      이미 ECR에 push된 추출기 이미지. SAM이 새로 빌드하지 않고 이 이미지를 그대로 참조한다
      (pdf/hwp/hwpx 3개 함수가 이미지 하나를 공유하고 ImageConfig.Command만 다르게 오버라이드).

  SourceBucketName:
    Type: String
    Default: realtime-dev-ds
    Description: raw/text_extracted가 있는 S3 버킷 이름. SAM 밖에서 이미 생성된 버킷이라 이름만 참조.

  NvidiaApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      NVIDIA Build API 키. 실제 값은 여기 Default에 넣지 말고 배포 시
      `sam deploy --parameter-overrides NvidiaApiKey=<실제키>`처럼 CLI로 직접 넘길 것
      (samconfig.toml은 git에 커밋되므로 여기에 실제 키를 적으면 히스토리에 평문으로 남는다).

  LlmBaseUrl:
    Type: String
    Default: "https://integrate.api.nvidia.com/v1"
    Description: LLM API base_url. 다른 OpenAI 호환 API로 교체할 경우만 바꾸면 됨.

  LlmModel:
    Type: String
    Default: "meta/llama-3.1-8b-instruct"
    Description: LLM 모델 이름.

Resources:
  # ============================================================
  # SQS — 메인 큐 3개 + DLQ 3개 (maxReceiveCount 3회 초과 시 DLQ로 이동)
  # ============================================================
  ExtractPdfDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-pdf-queue-dlq

  ExtractPdfQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-pdf-queue
      VisibilityTimeout: 720   # Lambda Timeout(120s)의 6배 — AWS 권장값
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractPdfDlq.Arn
        maxReceiveCount: 3

  ExtractHwpDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwp-queue-dlq

  ExtractHwpQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwp-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractHwpDlq.Arn
        maxReceiveCount: 3

  ExtractHwpxDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwpx-queue-dlq

  ExtractHwpxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: extract-hwpx-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ExtractHwpxDlq.Arn
        maxReceiveCount: 3

  LlmExtractDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: llm-extract-queue-dlq

  LlmExtractQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: llm-extract-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LlmExtractDlq.Arn
        maxReceiveCount: 3

  # ============================================================
  # IAM — 함수별 실행 역할.
  # 셋 다 동일한 패턴(S3 읽기 raw/*, S3 쓰기 text_extracted/*, 자기 큐 수신, 다음 큐 송신)이지만
  # "자기 큐" 수신 권한이 함수마다 다른 큐로 스코프돼야 해서 역할을 3개로 분리했다.
  # ============================================================
  ExtractPdfFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: extract-pdf-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs 기본 쓰기 권한 (Lambda 실행 로그)
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: extract-pdf-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/*"
              - Sid: WriteExtractedText
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/text_extracted/*"
        - PolicyName: extract-pdf-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExtractPdfQueue.Arn
              - Sid: SendToNextQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LlmExtractQueue.Arn

  ExtractHwpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: extract-hwp-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: extract-hwp-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/*"
              - Sid: WriteExtractedText
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/text_extracted/*"
        - PolicyName: extract-hwp-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExtractHwpQueue.Arn
              - Sid: SendToNextQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LlmExtractQueue.Arn

  ExtractHwpxFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: extract-hwpx-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: extract-hwpx-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/*"
              - Sid: WriteExtractedText
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/text_extracted/*"
        - PolicyName: extract-hwpx-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExtractHwpxQueue.Arn
              - Sid: SendToNextQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt LlmExtractQueue.Arn

  # LLM 추출 역할은 파이프라인 마지막 단계라 다음 큐로 보낼 SendMessage 권한이 없다
  # (S3 읽기 대상도 raw/*가 아니라 text_extracted/*, 쓰기 대상은 llm_extracted/*로 다름).
  LlmExtractFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: llm-extract-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: llm-extract-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExtractedText
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/text_extracted/*"
              - Sid: WriteLlmExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/llm_extracted/*"
        - PolicyName: llm-extract-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt LlmExtractQueue.Arn

  # ============================================================
  # Lambda — 3개 함수, 이미지 1개 공유(ImageUri 동일) + ImageConfig.Command만 다르게.
  # 각각 대응하는 큐를 SQS 트리거로 연결. BatchSize=1: handler가 배치 내 실패를 개별
  # 처리하지 않고 예외 하나로 전체를 재시도시키므로(코드 참고: src/handlers/*), 한 번에
  # 메시지 1개씩만 받아야 실패한 메시지만 정확히 재시도/DLQ된다.
  # ============================================================
  ExtractPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-pdf-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_pdf.lambda_handler"]
      Role: !GetAtt ExtractPdfFunctionRole.Arn
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref LlmExtractQueue
      Events:
        PdfQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractPdfQueue.Arn
            BatchSize: 1

  ExtractHwpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwp-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_hwp.lambda_handler"]
      Role: !GetAtt ExtractHwpFunctionRole.Arn
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref LlmExtractQueue
      Events:
        HwpQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractHwpQueue.Arn
            BatchSize: 1

  ExtractHwpxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwpx-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_hwpx.lambda_handler"]
      Role: !GetAtt ExtractHwpxFunctionRole.Arn
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref LlmExtractQueue
      Events:
        HwpxQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ExtractHwpxQueue.Arn
            BatchSize: 1

  # LLM 추출 함수 — 같은 이미지 공유, CMD만 다름. NVIDIA Build API의 분당 요청 한도(40 RPM) 대비
  # ReservedConcurrentExecutions로 동시 실행 수를 5로 제한(안 걸면 SQS 트리거가 메시지 쌓인 만큼
  # 동시에 확장해서 순식간에 RPM을 초과시킬 수 있음).
  LlmExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-llm-dev
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["handlers.extract_llm.lambda_handler"]
      Role: !GetAtt LlmExtractFunctionRole.Arn
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          NVIDIA_API_KEY: !Ref NvidiaApiKey
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_MODEL: !Ref LlmModel
      Events:
        LlmQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt LlmExtractQueue.Arn
            BatchSize: 1
