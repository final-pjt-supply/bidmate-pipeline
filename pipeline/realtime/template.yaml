AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  실시간 입찰공고 문서 처리 파이프라인 (2026-07-08 재구축, 2026-07-10 임베딩 분기 추가,
  2026-07-11 인덱싱 Lambda 배포, 2026-07-12 RDS 병합 배치 추가 #66).
  S3(bidmate) 업로드 → 이벤트 알림 → SQS(pdf/hwp/hwpx 3개) → 추출 Lambda 3개
  → extracted/ 저장 + (LLM 큐 / 임베딩 큐)로 병렬 분기 → LLM Lambda → qualifications/ 저장
  / 임베딩 Lambda → vectors/ 저장 → 인덱싱 Lambda(VPC 안, OpenSearch bulk 색인).
  qualifications/ → bid_table UPDATE는 SQS 체이닝과 무관하게 EventBridge 주기
  트리거로 별도 동작(RDS 병합 배치, #66). Step Functions는 안 쓰고 나머지는 전부
  SQS 메시지 체이닝으로 연결. S3 이벤트 알림 자체는 이 template 밖에서 별도
  스크립트(scripts/setup-s3-events.ps1)로 설정한다(이 배포엔 포함 안 함).

Parameters:
  # 2026-07-28: 아래 세 이미지 파라미터를 :latest → digest 고정으로 바꾼다.
  # MergeImageUri 주석에 이미 적혀 있던 원칙(":latest 금지")을 나머지에도 적용하는 것.
  #
  # 계기: :latest 태그가 각각 7/09, 7/11에 멈춰 있는데 실제 운영 함수는 그보다
  # 나중 이미지로 돌고 있었다. 그 상태로 sam deploy를 하면 함수 4개가 조용히
  # 옛 코드로 롤백된다(추출 3개 7/14→7/09, 임베딩 7/26→7/11). 실제로 changeset을
  # 미리 만들어 확인했고, 실행하지 않고 아래 값으로 정정했다.
  #
  # 새 이미지를 푸시할 때마다 이 Default와 samconfig.toml의 값을 함께 갱신할 것.
  # 태그만 옮기고 여기를 안 고치면 같은 사고가 반복된다.
  ExtractorImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-extractor@sha256:a7c2f96ccfc335b0f8c337c542ca3bfae6b70e046f61e6cd9039d053b1d0769e
    Description: >
      pdf/hwp/hwpx 추출 Lambda 3개가 공유하는 이미지(ECR). CMD만 함수별로 다르게 오버라이드.
      현재 digest는 2026-07-14 푸시분(태그 78) — 배포 중인 값과 동일.

  LlmImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-llm@sha256:ce13b0f2d55c0e237837856a634672304e975b9fa23aa5e230c64c8f5b8c6ad3
    Description: >
      LLM 자격요건 추출 Lambda 전용 이미지(ECR). CMD가 이미지에 이미 내장돼 있어 오버라이드 안 함.
      현재 digest는 2026-07-09 푸시분 — 기존 :latest가 가리키던 것과 동일해 동작 변화 없음.

  EmbeddingImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-embedding@sha256:d59020d34e420d2b5a3510c8b42df520f091bd0e08fa2b36dd3a75afe7126849
    Description: >
      임베딩 Lambda 이미지(ECR, #64). 인덱싱 Lambda도 이 이미지를 공유한다 —
      pdf/hwp/hwpx가 ExtractorImageUri를 공유하는 것과 동일 패턴으로 CMD만 함수별로
      다르게 오버라이드. 현재 digest는 2026-07-26 푸시분(#92 제목 벡터 파이프라인,
      커밋 3328983) — realtime-embed-dev가 실제로 돌리고 있던 이미지다.
      이 배포로 realtime-index-dev도 같은 이미지로 올라가지만, #92 변경은
      handlers/embed_chunks.py와 common/paths.py 순수 추가(28줄, 삭제 0)뿐이고
      색인이 쓰는 paths.document_id_from_file_id는 그대로라 동작이 바뀌지 않는다.

  CloudflareAccountId:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Cloudflare 계정 ID(Workers AI BGE-M3 임베딩용, #64). LlmApiKey와 동일하게
      `sam deploy --parameter-overrides CloudflareAccountId=<실제값>`처럼 CLI로
      직접 넘길 것 — samconfig.toml은 git에 커밋되므로 여기 Default에 넣지 않는다.

  CloudflareApiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Cloudflare Workers AI API 토큰(#64). CloudflareAccountId와 동일하게
      `--parameter-overrides`로 CLI 전달.

  SourceBucketName:
    Type: String
    Default: bidmate
    Description: raw/extracted/qualifications가 있는 S3 버킷. 다른 팀원 소유, 원본(raw)은 읽기전용.

  # 2026-07-27 NVIDIA Build가 qwen/qwen3-next-80b-a3b-instruct를 EOL 처리해(HTTP 410)
  # LLM 추출이 100% 실패했다. 같은 모델이 Bedrock(us-east-1)에 qwen.qwen3-next-80b-a3b로
  # 있고 backfill이 이미 30일간 27,380건/오류 0.66%로 쓰고 있어 그쪽으로 옮긴다.
  # Bedrock은 OpenAI 호환 엔드포인트(/openai/v1)를 제공하므로 client.py는 그대로 두고
  # 파라미터만 교체한다 — 이미지 재빌드 불필요.
  LlmApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      LLM API 키. 현재는 Bedrock API 키(backfill의 AWS_BEARER_TOKEN_BEDROCK와 같은 것).
      실제 값은 여기 Default에 넣지 말고 배포 시
      `sam deploy --parameter-overrides LlmApiKey=<실제키>`처럼 CLI로 직접 넘길 것
      (samconfig.toml은 git에 커밋되므로 여기에 실제 키를 적으면 히스토리에 평문으로 남는다).
      OpenAI SDK는 SigV4를 못 해서 Bearer 토큰이 필요하다. boto3 Converse로 옮기면
      (backfill/src/backfill/llm_bedrock.py 참고) IAM Role로 붙어 이 키 자체가 없어진다.

  LlmBaseUrl:
    Type: String
    Default: "https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1"
    Description: >
      LLM API base_url. 다른 OpenAI 호환 API로 교체할 경우만 바꾸면 됨.
      Bedrock은 경로가 반드시 /openai/v1 이어야 한다 — /v1 은 200을 주지만 응답
      스키마가 달라 choices가 없다(2026-07-28 실측).

  LlmModel:
    Type: String
    Default: "qwen.qwen3-next-80b-a3b"
    Description: >
      LLM 모델 이름. Bedrock 표기는 슬래시가 아니라 점을 쓴다.
      us-east-1 전용 — ap-northeast-2에는 Qwen 계열이 없다.

  AlertEmail:
    Type: String
    Default: "bidmatefinal@gmail.com"
    Description: >
      CloudWatch 알람(DLQ 적체 등) 통보를 받을 이메일. SNS 구독 방식이라 배포 후
      해당 주소로 오는 확인 메일의 링크를 눌러야 실제로 알림이 도착하기 시작한다.

  # 2026-07-11 인덱싱 Lambda 배포 때 실제로 쓰였지만 이 template.yaml에는
  # 커밋되지 않았던 파라미터들(IaC drift) — #66 작업 중 발견해 반영한다
  # (2026-07-12, aws cloudformation get-template --template-stage Original로
  # 실배포본과 대조 확인). 값 자체는 실배포와 동일.
  OpenSearchHost:
    Type: String
    Default: "vpc-bidmate-search-duobze5kp7ajwj3e5fqy6r4dju.ap-northeast-2.es.amazonaws.com"
    Description: OpenSearch 클러스터 엔드포인트(Private VPC 안, 다른 팀원 소유). hostname만(스킴 없이).

  OpenSearchPort:
    Type: String
    Default: "443"

  OpenSearchIndexName:
    Type: String
    Default: "bid_chunks"

  OpenSearchUser:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      OpenSearch basic auth user. LlmApiKey와 동일하게
      `sam deploy --parameter-overrides OpenSearchUser=<실제값>`처럼 CLI로 전달할 것.

  OpenSearchPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: OpenSearch basic auth password. OpenSearchUser와 동일하게 CLI로 전달할 것.

  # ============================================================
  # 아래부터 RDS 병합 배치(#66) 전용 파라미터.
  # ============================================================
  MergeImageUri:
    Type: String
    Default: 890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-merge@sha256:085cfb01bdba1551106d72d2e81f346a4a86c70ee24bc4e80864664cecc26861
    Description: >
      RDS 병합 배치 전용 이미지(ECR, #66, Dockerfile.merge). 2026-07-14 #75
      대응(required_certs 타입 정정 + rollback + 회당 상한, 커밋 4f41e94)
      빌드/푸시로 digest 갱신됨. :latest 금지 — CloudFormation이 태그 변경을
      감지 못해 이미지가 바뀌어도 재배포가 안 될 수 있다. 이후 이미지를
      다시 빌드/푸시할 때마다 이 Default를 새 digest로 갱신할 것.

  MergeDbHost:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      RDS Postgres 엔드포인트(bidmate-postgres). Default 없음 — CLI로 명시
      전달 필수: `sam deploy --parameter-overrides MergeDbHost=<실제값>`.

  MergeDbName:
    Type: String
    NoEcho: true
    Default: "bidmate"
    Description: RDS DB 이름(2026-07-12 bastion 접속으로 확인된 실제 값).

  MergeDbUser:
    Type: String
    NoEcho: true
    Default: "bidmaster"
    Description: RDS 접속 계정(2026-07-12 bastion 접속으로 확인된 실제 값. OpenSearchUser와 같은 계정명이나 별개 시스템).

  MergeDbPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      RDS 접속 비밀번호. LlmApiKey와 동일한 관례 — samconfig.toml(git 커밋됨)에
      절대 넣지 말고 `sam deploy --parameter-overrides MergeDbPassword=<실제값>`로만 전달.

  MergeScheduleRate:
    Type: String
    Default: "rate(5 minutes)"
    Description: >
      RDS 병합 배치 실행 주기. 앞단 Airflow 수집 주기가 5분이라(2026-07-12
      확인) 병합이 그보다 느리면 신선도 병목이 되므로 맞춤. LLM 추출 실측
      처리시간(76~180초/문서, expected_file_count 1~2건 기준)에도 여유 있음.

  DryRun:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      병합 배치 실전 UPDATE 여부(#80, 하드코딩에서 파라미터로 전환). 실전
      전환은 배포 시 DryRun=false 명시 전달로만 가능하다 — 기본값 true(안전).
      `sam deploy --parameter-overrides DryRun=false`처럼 CLI로 명시해야만
      실제 UPDATE가 실행된다.

Resources:
  # ============================================================
  # SQS — 4쌍(본큐+DLQ), 전부 Standard 큐.
  # ============================================================
  RealtimeExtractPdfDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-pdf-queue-dlq
      MessageRetentionPeriod: 1209600   # 14일

  RealtimeExtractPdfQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-pdf-queue
      VisibilityTimeout: 720   # Lambda Timeout(120s)의 6배 — AWS 권장값
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeExtractPdfDlq.Arn
        maxReceiveCount: 3

  RealtimeExtractHwpDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwp-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeExtractHwpQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwp-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeExtractHwpDlq.Arn
        maxReceiveCount: 3

  RealtimeExtractHwpxDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwpx-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeExtractHwpxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-extract-hwpx-queue
      VisibilityTimeout: 720
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeExtractHwpxDlq.Arn
        maxReceiveCount: 3

  RealtimeLlmExtractDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-llm-extract-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeLlmExtractQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-llm-extract-queue
      # Lambda Timeout(900s)의 2배(=1800s). 실측 처리시간은 76~180초대(문서 크기에
      # 따라 편차 큼, 아래 ReservedConcurrentExecutions 주석 참고)라 900s Timeout
      # 자체엔 넉넉한 여유가 있고, VisibilityTimeout은 Timeout보다만 충분히 크면
      # 목적 달성 — 가시성 타임아웃 만료로 다른 워커가 같은 메시지를 집어가는
      # (중복 처리) 사태만 막으면 되고, 다른 큐들의 6배(5400s) 관례까지 늘릴 필요는
      # 없다.
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeLlmExtractDlq.Arn
        maxReceiveCount: 3

  RealtimeEmbedDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-embed-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeEmbedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-embed-queue
      # Lambda Timeout(300s)의 6배 — 추출 3종과 동일한 관례. LLM 큐처럼 편차 큰
      # 실측 처리시간이 아직 없어(#64는 이제 배포) 관례값을 그대로 따른다.
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeEmbedDlq.Arn
        maxReceiveCount: 3

  # 2026-07-11 인덱싱 Lambda 배포 때 함께 만들어졌지만 template.yaml에는
  # 커밋되지 않았던 큐들(IaC drift, #66에서 발견해 반영 — 위 OpenSearch
  # 파라미터와 동일한 사유/확인 방법).
  RealtimeIndexDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-index-queue-dlq
      MessageRetentionPeriod: 1209600

  RealtimeIndexQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: realtime-index-queue
      VisibilityTimeout: 1800   # Lambda Timeout(300s)의 6배 — 추출/임베딩과 동일 관례
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RealtimeIndexDlq.Arn
        maxReceiveCount: 3

  # ============================================================
  # IAM — 함수별 실행 역할, 최소권한.
  # ============================================================
  RealtimeExtractPdfFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-extract-pdf-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-extract-pdf-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: ReadExtractedForDedupCheck
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: ListBucketForDedupCheck
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}"
                Condition:
                  StringLike:
                    s3:prefix: "extracted/*"
        - PolicyName: realtime-extract-pdf-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeExtractPdfQueue.Arn
              - Sid: SendToLlmQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn
              - Sid: SendToEmbedQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeEmbedQueue.Arn

  RealtimeExtractHwpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-extract-hwp-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-extract-hwp-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: ReadExtractedForDedupCheck
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: ListBucketForDedupCheck
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}"
                Condition:
                  StringLike:
                    s3:prefix: "extracted/*"
        - PolicyName: realtime-extract-hwp-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeExtractHwpQueue.Arn
              - Sid: SendToLlmQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn
              - Sid: SendToEmbedQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeEmbedQueue.Arn

  RealtimeExtractHwpxFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-extract-hwpx-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-extract-hwpx-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRawDocuments
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/downloads/daily/*"
              - Sid: WriteExtracted
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: ReadExtractedForDedupCheck
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: ListBucketForDedupCheck
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}"
                Condition:
                  StringLike:
                    s3:prefix: "extracted/*"
        - PolicyName: realtime-extract-hwpx-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeExtractHwpxQueue.Arn
              - Sid: SendToLlmQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn
              - Sid: SendToEmbedQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeEmbedQueue.Arn

  # SendToIndexQueue는 2026-07-11 인덱싱 Lambda 배포 때 실제로 추가됐지만
  # template.yaml에는 커밋되지 않았던 문(IaC drift) — #66에서 발견해 반영.
  RealtimeEmbedFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-embed-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-embed-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExtracted
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: ReadCuratedBidMetadata
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/raw/curated/*"
              - Sid: WriteVectors
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/vectors/*"
        - PolicyName: realtime-embed-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeEmbedQueue.Arn
              - Sid: SendToIndexQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RealtimeIndexQueue.Arn

  # 2026-07-11 배포 때 실제로 있었지만 template.yaml에 커밋되지 않았던 역할
  # (IaC drift, #66에서 발견해 반영). OpenSearch가 Private VPC 안에 있어
  # AWSLambdaVPCAccessExecutionRole이 필요하다(ENI 생성/해제 권한 — 인덱싱
  # 403 인시던트가 정확히 이걸 빼먹은 사례였다, #66 SAM 설계 단계에서
  # 재확인). OpenSearch 인증은 SigV4가 아니라 basic auth(indexing/
  # opensearch_client.py 참고)라 IAM에 OpenSearch 관련 Action은 없다.
  RealtimeIndexFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-index-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: realtime-index-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadVectors
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/vectors/*"
        - PolicyName: realtime-index-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeIndexQueue.Arn

  # LLM 역할은 파이프라인 마지막 단계라 다음 큐로 보낼 SendMessage 권한이 없다.
  RealtimeLlmExtractFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-llm-extract-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: realtime-llm-extract-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExtracted
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/extracted/*"
              - Sid: WriteQualifications
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/qualifications/*"
        - PolicyName: realtime-llm-extract-sqs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReceiveFromOwnQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RealtimeLlmExtractQueue.Arn

  # RDS 병합 배치(#66) 역할. EventBridge 스케줄 트리거라 SQS 권한이 필요 없다.
  # RDS가 Private VPC 안에 있어 AWSLambdaVPCAccessExecutionRole 필수(ENI
  # 생성/해제 — 위 인덱싱 역할과 동일한 이유, 인덱싱 403 인시던트 교훈).
  RealtimeMergeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: realtime-merge-function-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: realtime-merge-s3-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadQualifications
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/qualifications/*"
              - Sid: ListQualificationsForInventory
                # merge/inventory.py의 build_inventory가 list_objects_v2로
                # qualifications/ 전체를 리스팅한다 — GetObject만 주고
                # ListBucket을 빼먹으면 인덱싱 403 인시던트와 똑같은 실수가
                # 된다(#62 교훈, #66 SAM 설계 단계에서 명시적으로 챙김).
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}"
                Condition:
                  StringLike:
                    s3:prefix: "qualifications/*"
        - PolicyName: realtime-merge-sns-publish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishFailureToAlerts
                # Lambda 비동기 호출 Destinations(RealtimeMergeFunction의
                # EventInvokeConfig.DestinationConfig.OnFailure)는 EventBridge나
                # Lambda 서비스 role이 대상에 쓰는 게 아니라, 호출된 함수 "자신의"
                # 실행 role 권한으로 쓴다 — 2차 배포 시도에서 이 권한이 없어
                # EventInvokeConfig 생성 자체가 거부되는 것으로 확인됨. 다른
                # SQS 트리거 Lambda role들엔 이 권한이 없어도 되는 이유:
                # (1) 그 Lambda들의 실패 처리는 EventInvokeConfig가 아니라
                # SQS RedrivePolicy(큐 레벨)로 SQS 서비스가 직접 처리하고,
                # (2) DLQ 알람의 SNS 발행은 CloudWatch 서비스가 알람 액션으로
                # 호출한다(토픽 정책이 cloudwatch.amazonaws.com을 허용) — 둘 다
                # Lambda 실행 role과 무관한 경로라 이 권한이 필요 없었다.
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref RealtimeAlertsTopic

  # ============================================================
  # Lambda — pdf/hwp/hwpx 3개는 이미지 1개 공유(ExtractorImageUri) + CMD만 다르게.
  # LLM 1개는 별도 이미지(LlmImageUri, CMD 내장). 각각 대응 큐를 SQS 트리거로 연결.
  # BatchSize=1: handler가 배치 내 실패를 개별 처리하지 않고 예외 하나로 전체를
  # 재시도시키므로, 한 번에 메시지 1개씩만 받아야 실패한 메시지만 정확히 재시도/DLQ된다.
  # ============================================================
  RealtimeExtractPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-pdf-dev
      PackageType: Image
      ImageUri: !Ref ExtractorImageUri
      ImageConfig:
        Command: ["handlers.extract_pdf.lambda_handler"]
      Role: !GetAtt RealtimeExtractPdfFunctionRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref RealtimeLlmExtractQueue
          EMBED_QUEUE_URL: !Ref RealtimeEmbedQueue
      Events:
        PdfQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeExtractPdfQueue.Arn
            BatchSize: 1

  RealtimeExtractHwpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwp-dev
      PackageType: Image
      ImageUri: !Ref ExtractorImageUri
      ImageConfig:
        Command: ["handlers.extract_hwp.lambda_handler"]
      Role: !GetAtt RealtimeExtractHwpFunctionRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref RealtimeLlmExtractQueue
          EMBED_QUEUE_URL: !Ref RealtimeEmbedQueue
      Events:
        HwpQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeExtractHwpQueue.Arn
            BatchSize: 1

  RealtimeExtractHwpxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-extract-hwpx-dev
      PackageType: Image
      ImageUri: !Ref ExtractorImageUri
      ImageConfig:
        Command: ["handlers.extract_hwpx.lambda_handler"]
      Role: !GetAtt RealtimeExtractHwpxFunctionRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          LLM_EXTRACT_QUEUE_URL: !Ref RealtimeLlmExtractQueue
          EMBED_QUEUE_URL: !Ref RealtimeEmbedQueue
      Events:
        HwpxQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeExtractHwpxQueue.Arn
            BatchSize: 1

  # NVIDIA Build API의 분당 요청 한도(40 RPM) 대비 ReservedConcurrentExecutions로 동시
  # 실행 수를 제한(안 걸면 SQS 트리거가 메시지 쌓인 만큼 동시에 확장해서 순식간에 RPM을
  # 초과시킬 수 있음). qwen3-next-80b 기준 실측 처리시간은 76~180초대(문서 크기 따라
  # 편차 큼 — 최초 추정치였던 "약 27초/건"은 실측과 안 맞아 폐기), RPM 한도만 보면
  # 동시성 5도 충분히 안전(약 1.7~3.9 RPM, 60s/180s*5 ~ 60s/76s*5).
  #
  # 2026-07-14 (#78) 5 → 3으로 하향: RPM 한도와 별개로, DLQ redrive 시 밀린
  # 문서가 한꺼번에 큐로 유입되면 NVIDIA API 동시 호출 버스트로 거절됨이
  # 실측 확인됨(2026-07-10, DLQ 25건 — 400/500/504 혼재, 순간 동시 요청 수가
  # 문제였지 RPM 누적 총량이 문제가 아니었음). 동시 실행 상한을 더 좁혀
  # redrive 시 유량 자체를 제한한다.
  #
  # 2026-07-28 Bedrock 전환 후 주의: 위 3이라는 값의 근거였던 "NVIDIA Build의 40 RPM
  # 한도"와 "NVIDIA 동시 호출 버스트 거절"은 더 이상 적용되지 않는다. Bedrock은
  # 자체 쿼터 체계라 상한을 올릴 여지가 있으나, 실측 없이 한 번에 풀지 말고
  # 3 → 10 정도로 올려 Throttles 지표를 관찰한 뒤 결정할 것. DLQ 240건 redrive는
  # 상향 전에 현재 값(3)으로 먼저 흘려보내는 편이 안전하다.
  #
  # Timeout=900s(15분, AWS Lambda 허용 최대치): 기존 180s → 600s → 900s로 상향.
  # 실제 요청 단위 컷오프는 extractors/llm/client.py의 OpenAI 클라이언트
  # timeout(600s, 10분)이 먼저 걸린다 — 정상이지만 느린 완료(실측 76~180초대,
  # 표본 밖의 더 큰 문서는 더 걸릴 수 있음)를 섣불리 끊어서 재시도로 낭비하지
  # 않도록 10분까지 유예를 주되, 진짜 멈춘 요청이 무한정 슬롯을 붙잡는 것도
  # 막는 절충점이다. 900s(Lambda Timeout)는 client timeout(600s)이 못 잡는
  # 예상 못 한 hang에 대한 바깥쪽 안전망 역할만 한다.
  RealtimeLlmExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-llm-extract-dev
      PackageType: Image
      ImageUri: !Ref LlmImageUri
      Role: !GetAtt RealtimeLlmExtractFunctionRole.Arn
      Timeout: 900
      MemorySize: 1024
      ReservedConcurrentExecutions: 3
      Environment:
        Variables:
          # 환경변수 이름은 NVIDIA_API_KEY 그대로 둔다 — common/config.py가 이 이름으로
          # 읽으므로 바꾸려면 코드 수정 + 이미지 재빌드가 필요하다. Converse 전환 시
          # 함께 정리한다(그때는 키 자체가 없어진다).
          NVIDIA_API_KEY: !Ref LlmApiKey
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_MODEL: !Ref LlmModel
      Events:
        LlmQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeLlmExtractQueue.Arn
            BatchSize: 1
            # 2026-07-28 추가. ReservedConcurrentExecutions만 걸면 SQS 폴러는 그 상한을
            # 모른 채 계속 메시지를 끌어와 호출을 시도하고, 넘치는 만큼 Throttle된다.
            # 실측: 7/20 하루 Throttle 1,587건(같은 날 실제 호출 284건의 5배 이상),
            # 7/28 DLQ 269건 redrive 중 720건(실제 호출 323건). 처리 자체는 재시도로
            # 흡수됐지만 불필요한 지연이 발생했다.
            #
            # 폴러 쪽 상한을 예약 동시성과 같은 값으로 맞춰 과다 폴링 자체를 막는다.
            # 이 값은 ReservedConcurrentExecutions와 함께 움직여야 한다 — 한쪽만
            # 올리면 다시 어긋난다. (허용 최소값은 2)
            ScalingConfig:
              MaximumConcurrency: 3

  # 이 함수는 VPC 밖에 남는다(Cloudflare 외부 API 호출 때문 — VPC 안에 넣으면
  # 인터넷이 막힘). INDEX_QUEUE_URL은 2026-07-11 인덱싱 Lambda 배포 시점에
  # 실제로 연결됐다(아래 RealtimeIndexFunction 참고) — 이 주석은 원래
  # "인덱싱은 후속으로 미룸" 상태를 설명했는데, template.yaml이 그 이후의
  # 실배포 상태를 못 따라간 것(IaC drift)을 #66 작업 중 발견해 지금 반영한다.
  # Timeout=300s: 로컬 검증(experiments/embedding)에서 실측한 최대 단일 문서
  # 청크수(656개, ms_per_chunk 실측 46.2ms 기준 약 30초) 대비 10배 여유 —
  # #62(오전 LLM 타임아웃 인시던트) 교훈으로 여유를 크게 둠. VisibilityTimeout은
  # 추출 3종과 동일한 "Timeout×6" 관례.
  RealtimeEmbedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-embed-dev
      PackageType: Image
      ImageUri: !Ref EmbeddingImageUri
      ImageConfig:
        Command: ["handlers.embed_chunks.lambda_handler"]
      Role: !GetAtt RealtimeEmbedFunctionRole.Arn
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          CLOUDFLARE_ACCOUNT_ID: !Ref CloudflareAccountId
          CLOUDFLARE_API_TOKEN: !Ref CloudflareApiToken
          INDEX_QUEUE_URL: !Ref RealtimeIndexQueue
      Events:
        EmbedQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeEmbedQueue.Arn
            BatchSize: 1

  # 2026-07-11 배포됐지만 template.yaml에 커밋되지 않았던 함수(IaC drift, #66
  # 발견/반영 — 위 파라미터·큐·역할과 동일 건). OpenSearch가 Private VPC
  # 안에 있어 이 함수는 VpcConfig가 필요하다(embed와 반대로 여기는 VPC 안).
  # 이미지는 EmbeddingImageUri를 그대로 공유한다(Dockerfile.embedding에
  # index_opensearch.py/indexing/도 같이 들어있음 — pdf/hwp/hwpx가
  # ExtractorImageUri를 공유하는 것과 동일 패턴, Command만 다르게 오버라이드).
  RealtimeIndexFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-index-dev
      PackageType: Image
      ImageUri: !Ref EmbeddingImageUri
      ImageConfig:
        Command: ["handlers.index_opensearch.lambda_handler"]
      Role: !GetAtt RealtimeIndexFunctionRole.Arn
      Timeout: 300
      MemorySize: 1024
      VpcConfig:
        SubnetIds:
          - subnet-0348f5a655ef2f9b5
          - subnet-0097fa998d43ebf09
        SecurityGroupIds:
          - sg-065449fe7966d3012   # realtime-indexing-sg, OpenSearch SG의 443 인바운드 허용대상
      Environment:
        Variables:
          OPENSEARCH_MODE: aws
          OPENSEARCH_HOST: !Ref OpenSearchHost
          OPENSEARCH_PORT: !Ref OpenSearchPort
          OPENSEARCH_INDEX_NAME: !Ref OpenSearchIndexName
          OPENSEARCH_USER: !Ref OpenSearchUser
          OPENSEARCH_PASSWORD: !Ref OpenSearchPassword
      Events:
        IndexQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt RealtimeIndexQueue.Arn
            BatchSize: 1

  # ============================================================
  # RDS 병합 배치(#66) — EventBridge 주기 트리거, SQS 체이닝과 무관한 별도 흐름.
  # 이미지 분리 이유는 Dockerfile.merge 주석 참고. VPC/서브넷은 인덱싱과 동일
  # (RDS·서브넷이 같은 VPC), SG만 병합 전용(realtime-merge-sg)으로 다르다.
  # Timeout=300s 근거: qualifications/ 전체 리스팅(2026-07-12 기준 27,428건,
  # ~28페이지) 약 10~15초 + 대상 10건 처리(건당 S3 GetObject+병합+DB 쿼리) 약
  # 30초 — 실측 예상 1분 이내지만 다른 Lambda들의 "실측의 5~10배 여유" 관례를
  # 따름. bid_table 대상 행이 수백 건으로 늘면 이 값과 배치 전략을 재검토할 것.
  # DRY_RUN은 #80부터 CloudFormation 파라미터(DryRun, 위 Parameters 참고)로
  # 뺐다 — 실전 전환은 배포 시 DryRun=false 명시 전달로만 가능하다. 기본값은
  # true(안전) — 파라미터를 안 넘기면 항상 dry-run으로 배포된다.
  # EventInvokeConfig: 이 배치는 handler 내부에서 bid_id별 실패를 이미 격리하므로
  # (merge_qualifications.py), 호출 전체가 실패하는 경우는 대부분 콜드스타트의
  # DB 연결/스키마 가드 같은 구조적 문제다 — 즉시 재시도해도 똑같이 실패할
  # 가능성이 높아 MaximumRetryAttempts=0으로 두고, 대신 실패 즉시 기존
  # RealtimeAlertsTopic(SNS)으로 알린다. SQS DLQ처럼 메시지가 쌓이는 구조가
  # 아니라 "실패한 호출 1건" 알림이라는 점이 기존 DLQ 알람들과 다르다.
  RealtimeMergeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: realtime-merge-dev
      PackageType: Image
      ImageUri: !Ref MergeImageUri
      Role: !GetAtt RealtimeMergeFunctionRole.Arn
      Timeout: 300
      MemorySize: 512
      VpcConfig:
        SubnetIds:
          - subnet-0348f5a655ef2f9b5
          - subnet-0097fa998d43ebf09
        SecurityGroupIds:
          - sg-08ae3328fa7784b6f   # realtime-merge-sg
      Environment:
        Variables:
          MERGE_DB_HOST: !Ref MergeDbHost
          MERGE_DB_NAME: !Ref MergeDbName
          MERGE_DB_USER: !Ref MergeDbUser
          MERGE_DB_PASSWORD: !Ref MergeDbPassword
          SOURCE_BUCKET: !Ref SourceBucketName
          DRY_RUN: !Ref DryRun   # #80 — 하드코딩에서 파라미터로 전환. 실전 전환은 배포 시 DryRun=false 명시 전달로만 가능. 기본값 true(안전)
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination: !Ref RealtimeAlertsTopic
      Events:
        MergeSchedule:
          Type: Schedule
          Properties:
            Schedule: !Ref MergeScheduleRate
            Enabled: true

  # ============================================================
  # SNS — 알람 통보용. 2026-07-09~10 IAM 권한 누락 인시던트가 액션 없는
  # 콘솔전용 알람 5개로는 못 잡혔던 것("울려도 무의미")에 대한 조치.
  # ============================================================
  RealtimeAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: realtime-pipeline-alerts
      DisplayName: Realtime Pipeline Alerts

  RealtimeAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref RealtimeAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ============================================================
  # CloudWatch 알람 — 전부 RealtimeAlertsTopic(SNS)으로 통보됨.
  # ============================================================
  RealtimeLlmExtractQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-llm-extract-queue-backlog
      AlarmDescription: >
        realtime-llm-extract-queue에 메시지가 15분 이상 100개를 초과해 쌓여있음.
        ReservedConcurrentExecutions=5 제한 때문에 처리가 밀리고 있다는 신호.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeLlmExtractQueue.QueueName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  RealtimeExtractPdfDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-extract-pdf-queue-dlq-has-messages
      AlarmDescription: realtime-extract-pdf-queue-dlq에 메시지가 1개 이상 쌓임.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeExtractPdfDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  RealtimeExtractHwpDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-extract-hwp-queue-dlq-has-messages
      AlarmDescription: realtime-extract-hwp-queue-dlq에 메시지가 1개 이상 쌓임.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeExtractHwpDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  RealtimeExtractHwpxDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-extract-hwpx-queue-dlq-has-messages
      AlarmDescription: realtime-extract-hwpx-queue-dlq에 메시지가 1개 이상 쌓임.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeExtractHwpxDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  RealtimeEmbedDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-embed-queue-dlq-has-messages
      AlarmDescription: realtime-embed-queue-dlq에 메시지가 1개 이상 쌓임.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeEmbedDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  # 2026-07-11 배포됐지만 template.yaml에 커밋되지 않았던 알람(IaC drift, #66
  # 발견/반영).
  RealtimeIndexDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-index-queue-dlq-has-messages
      AlarmDescription: realtime-index-queue-dlq에 메시지가 1개 이상 쌓임.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeIndexDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  RealtimeLlmExtractDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-llm-extract-queue-dlq-has-messages
      AlarmDescription: realtime-llm-extract-queue-dlq에 메시지가 1개 이상 쌓임.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeLlmExtractDlq.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  # 2026-07-09~10 NVIDIA 산발적 500(약 9% 빈도, SQS 재시도로 흡수 중, DLQ 미증가)
  # 조사 결과에 따른 조기 경고 알람. 위 has-messages 알람과 달리 절대 임계값이
  # 아니라 "재시도로도 못 흡수할 만큼 악화"를 감지하는 게 목적. 조사 당시 잔존하던
  # 9건(과거 NVIDIA 일시 장애 잔재)은 이 알람 설정 직전에 별도로 redrive해 비웠으므로
  # 베이스라인 0 기준 5건 그대로 임계값으로 씀. 발동 시 NVIDIA 서빙처 이전을 재검토.
  RealtimeLlmExtractDlqGrowthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-llm-extract-queue-dlq-growth-warning
      AlarmDescription: >
        realtime-llm-extract-queue-dlq에 메시지가 5개 이상 쌓임 — SQS
        재시도(maxReceiveCount=3)로도 못 흡수할 만큼 NVIDIA 장애가 심해졌다는
        조기 경고.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RealtimeLlmExtractDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic

  # RDS 병합 배치(#66)는 SQS가 아니라 EventBridge 스케줄 트리거라 DLQ
  # has-messages 알람 패턴을 그대로 못 쓴다(위 RealtimeMergeFunction 주석의
  # EventInvokeConfig 설명 참고) — 대신 Lambda 자체의 Errors 메트릭을 본다.
  # handler가 bid_id별 실패를 이미 격리하므로, 이 알람이 울린다는 건 대부분
  # 콜드스타트의 DB 연결/스키마 가드 실패 같은 구조적 문제라는 뜻이다.
  RealtimeMergeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: realtime-merge-function-errors
      AlarmDescription: realtime-merge-dev Lambda가 1회 이상 에러로 실패함.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RealtimeMergeFunction
      Statistic: Sum
      Period: 300   # MergeScheduleRate(기본 5분, 2026-07-12 Airflow 주기 맞춤)와 일치
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RealtimeAlertsTopic
