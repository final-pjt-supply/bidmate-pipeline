version = 0.1

[default.deploy.parameters]
stack_name = "realtime-dev"
resolve_s3 = true
s3_prefix = "realtime-dev"
confirm_changeset = true
capabilities = "CAPABILITY_NAMED_IAM"
# LlmApiKey/CloudflareAccountId/CloudflareApiToken은 여기 넣지 않는다(이 파일은
# git에 커밋됨) — 배포 시 `sam deploy --parameter-overrides LlmApiKey=<실제키>
# CloudflareAccountId=<실제값> CloudflareApiToken=<실제값>`처럼 CLI로 별도로 넘길 것.
#
# 2026-07-28: 파라미터 이름이 NvidiaApiKey → LlmApiKey로 바뀌었다. 예전 이름으로
# 넘기면 sam이 "unknown parameter" 오류를 내므로 조용히 실패하지는 않는다.
# 값에는 NVIDIA 키가 아니라 Bedrock API 키를 넣어야 한다.
#
# 2026-07-28: 이미지 3종을 :latest -> digest 고정으로 변경. :latest가 7/09~7/11에
# 멈춰 있어 그대로 배포하면 실제 운영 함수 4개가 옛 코드로 롤백되는 상태였다.
# 새 이미지를 푸시하면 여기와 template.yaml의 Default를 함께 갱신할 것.
#
# 2026-08-05: ExtractorImageUri를 PR #111 머지분 이미지(태그 pr111)로 갱신.
# a7c2f96c(7/14) -> 58c12324. 나머지 이미지 3종은 그대로다.
#
# 2026-08-05: ExtractorImageUri를 태그 hwpml 이미지로 갱신. 58c12324 -> 3a8cdb75.
# HWPML(한글 XML 저장 형식) 추출기 추가 — 압축 첨부 해제 이후 파일명만 .hwp인
# HWPML이 유입돼 "Not an OLE2"로 영구 실패하던 것을 잡는다.
#
# 2026-08-05: MergeImageUri를 태그 zipfix 이미지로 갱신. b2557430(7/14) -> c367ef60.
# merge/logic.py에 "expected_file_count가 0이면 pending 유지" 방어선이 들어갔다.
# ⚠ 이 배포가 Airflow의 압축 첨부 해제(ingestion)보다 먼저여야 한다 — 순서가 바뀌면
# 기대 문서 수가 0인 채로 문서가 생겨 공고가 조기에 merged로 확정되고, merged 행은
# 병합 배치가 다시 뽑지 않아 되돌릴 수 없다.
#
# 2026-08-06: MergeImageUri를 태그 noattach 이미지로 갱신. c367ef60 -> 3269e86d.
# 첨부가 아예 없는 공고를 pending에서 no_attachment로 빼내는 스윕이 들어갔다
# (merge/db.sweep_no_attachment). 무첨부 공고는 산출물이 안 생겨 daily 인벤토리
# 필터에 매번 걸러지고, 그래서 병합 대상이 되지 못한 채 pending에 영구히 고인다.
parameter_overrides ="ExtractorImageUri=\"890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-extractor@sha256:3a8cdb7562aa27b9ea2744a52712fb4d814d6079d1346dc7cdeba5fb458a26ec\" LlmImageUri=\"890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-llm@sha256:ce13b0f2d55c0e237837856a634672304e975b9fa23aa5e230c64c8f5b8c6ad3\" EmbeddingImageUri=\"890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-embedding@sha256:d59020d34e420d2b5a3510c8b42df520f091bd0e08fa2b36dd3a75afe7126849\" SourceBucketName=\"bidmate\" LlmBaseUrl=\"https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1\" LlmModel=\"qwen.qwen3-next-80b-a3b\" MergeImageUri=\"890608337282.dkr.ecr.ap-northeast-2.amazonaws.com/bidding-agent-realtime-merge@sha256:3269e86d296735bf5f516116de5bb36ccdbbd9af922aa713b3ebcd28db850092\" TagMaxPerRun=\"500\""
image_repositories = []

[default.global.parameters]
region = "ap-northeast-2"
