# Airflow 단일 노드 (LocalExecutor) — 메타DB는 외부 RDS, 수집+다운로드 DAG 전용.
# Redis/Celery worker/Flower/Postgres 컨테이너 없음 (LocalExecutor + 외부 RDS).
#
# 사전 준비: .env 작성 (.env.example 참고), IAM 역할로 S3 접근, RDS(Postgres) 생성.
# 기동: docker compose up -d --build
# UI: http://<EC2-IP>:8080

x-airflow-common: &airflow-common
  build: .
  image: bidding-airflow:2.10.5
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${RDS_USER}:${RDS_PASSWORD}@${RDS_HOST}:${RDS_PORT}/${RDS_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # 선형 DAG(4태스크)라 병렬도는 작게
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    # ── 수집·다운로드 스크립트가 읽는 환경변수 (DAG가 subprocess로 실행) ──
    BIDDING_AGENT_HOME: /opt/bidding-agent
    BIDDING_AGENT_PYTHON: python
    G2B_SERVICE_KEY: ${G2B_SERVICE_KEY}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    # AWS 자격증명은 EC2 IAM 역할(instance profile)로 자동 주입 — 키를 넣지 말 것.
    # 리전만 명시해 boto3가 엔드포인트를 확정하게 한다.
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # repo 전체를 마운트 — DAG가 여기서 python raw_json_daily.py 등을 실행한다.
    - .:/opt/bidding-agent
  user: "${AIRFLOW_UID:-50000}:0"

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname admin --lastname admin --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
