name: Gemini PR Review

# PR이 열리거나 새 커밋이 푸시될 때 자동으로 Gemini가 리뷰 코멘트를 답니다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Get PR diff
        run: |
          git fetch --quiet origin "${{ github.event.pull_request.base.ref }}"
          git diff --unified=2 "origin/${{ github.event.pull_request.base.ref }}"...HEAD > diff.txt
          echo "Diff lines: $(wc -l < diff.txt)"

      - name: Gemini review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # 무료 등급에서 쓸 수 있는 모델. 필요하면 gemini-2.5-flash-lite 등으로 교체 가능.
          GEMINI_MODEL: "gemini-2.5-flash"
        run: python .github/scripts/gemini_review.py
