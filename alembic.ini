# Alembic config - BidMate API server only.
# NOTE: This Alembic manages ONLY API-server-owned tables (company, match_results, ...).
# Pipeline-owned tables (bid_table, bid_attachments) are governed by db/schema/*.sql (SSOT)
# and excluded via include_object in alembic/env.py. See alembic/README.md (Korean docs).
#
# DB URL is NOT hardcoded here; env.py injects it from app.config (.env / env vars).
# Keep this file ASCII-only: Windows configparser reads it with the locale codec (cp949).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# sqlalchemy.url left blank on purpose - env.py provides it via app.config.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
