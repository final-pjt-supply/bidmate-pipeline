# 로컬 개발용 PostgreSQL.
#
# 실행: db/ 에서 `docker compose up -d`
#
# ⚠ 스키마 변경 시 반드시 `docker compose down -v` 후 다시 `up -d`할 것.
#   초기화 스크립트(./schema/*.sql)는 volume이 비어있는 "최초 기동" 시에만 실행된다.
#   기존 volume이 남아있으면 -v 없이 up 해도 새 스키마가 반영되지 않는다.
#
# 값은 .env(리포 루트)의 POSTGRES_* 기본값과 동일하게 맞춰뒀다.
services:
  postgres:
    image: postgres:16
    container_name: bidding-agent-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bidding_agent
      POSTGRES_USER: bidding_agent
      POSTGRES_PASSWORD: bidding_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema/ 안의 *.sql이 파일명 순서대로 실행됨 — 01_bid_table.sql이 FK 대상이라 먼저 실행되게
      # 번호를 접두어로 붙여뒀다(접두어 없으면 알파벳 순 "bid_attachments" < "bid_table"로 뒤집힘).
      - ./schema:/docker-entrypoint-initdb.d:ro

  # 로컬 임베딩 실험(knn 검색 테스트)용 — .env의 OPENSEARCH_*(실제 AWS 관리형
  # bidmate-search 클러스터, 다른 팀 소유)와는 완전히 별개다. 인증 없이 로컬에서만
  # 접근하는 용도라 보안 플러그인을 껐다(DISABLE_SECURITY_PLUGIN) — 절대 외부에
  # 노출하면 안 됨, 로컬 전용.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: bidding-agent-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - osdata:/usr/share/opensearch/data

volumes:
  pgdata:
  osdata:
